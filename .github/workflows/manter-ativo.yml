name: Manter o servidor ativo
# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta rotina faz uma consulta leve a cada 3 dias para ele nunca pausar.
on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao servidor
        run: |
          curl -fsS -X POST "https://dqiczyjjbjperoagswgp.supabase.co/rest/v1/rpc/prumo_prova_abrir" -H "apikey: sb_publishable_STerZw0LCBYFdkh3enzfNQ_jSg87ebz" -H "Content-Type: application/json" -d '{"p_codigo":"PING","p_pin":"000000"}' -w "\nServidor respondeu: HTTP %{http_code}\n"
