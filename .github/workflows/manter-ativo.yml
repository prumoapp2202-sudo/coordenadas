name: Manter o servidor ativo
# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta rotina faz uma consulta leve a cada 3 dias para ele nunca pausar.
on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao servidor
        run: |
          curl -fsS "https://dqiczyjjbjperoagswgp.supabase.co/rest/v1/escolas?select=id&limit=1" -H "apikey: sb_publishable_STerZw0LCBYFdkh3enzfNQ_jSg87ebz" -o /dev/null -w "Servidor respondeu: HTTP %{http_code}\n"
