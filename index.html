<style>

   PICTURE: a própria ferramenta; no topo, uma faixa com a grade e casas trocadas em coral.
   COLOUR and TYPE: azul-petróleo dominante, fundo areia, terracota de acento; Inter em tudo.

--coral:light-dark(#B5532F,#E58A66);--coralSoft:light-dark(#F6E1D8,#3A2219);--ok:light-dark(#1B7F4B,#62d39d);--okSoft:light-dark(#E2F2E9,#15301f);
--warn:light-dark(#8a5a00,#f0c162);--warnSoft:light-dark(#FBF0D9,#362c12);--grey:light-dark(#EEF0F3,#222c31)}

<header class="top">

<script>
/* Núcleo do Corretor (mesmo motor do Corretor EMFAL): layout da folha, geração do PDF e leitura da foto.
   Funciona no navegador (window.OMR) e no Node (module.exports) para testes. */
(function (root) {
  'use strict';

  // ===== Layout da folha (milímetros, A4 retrato) =====
  var L = {
    W: 210, H: 297,
    mk: { s: 9, c: [[14, 14], [196, 14], [196, 283], [14, 283]] }, // TL, TR, BR, BL
    rows: 25, colX0: 24, colW: 43, rowY0: 100, rowH: 7.0, numW: 9, gap: 6.6, r: 2.5,
    qr: { x: 160, y: 21, s: 28 },
    maxQ: 100
  };
  var LETRAS = 'ABCDE';

  /* Duas versões de layout da grade:
     1 = folhas antigas (colunas fixas de 25 questões, alinhadas à esquerda);
     2 = folha atual (colunas equilibradas e distribuídas na largura, em quadros).
     O QR Code das folhas novas diz que é a versão 2; folhas antigas continuam sendo lidas como versão 1. */
  function grade(n, alt, lay) {
    var cols = Math.max(1, Math.ceil(n / L.rows));
    if (lay !== 2) return { cols: cols, rows: L.rows, x0: function (k) { return L.colX0 + k * L.colW; } };
    if (n > 10 && cols < 2) cols = 2;
    var rows = Math.ceil(n / cols), larg = L.numW + 2 * L.r + (alt - 1) * L.gap + 1, area = 170, esp = (area - cols * larg) / cols;
    return { cols: cols, rows: rows, larg: larg, x0: function (k) { return 20 + esp / 2 + k * (larg + esp) - 0.5; } };
  }
  function bolinha(q, a, G) {
    G = G || grade(L.maxQ, 5, 1);
    var col = Math.floor(q / G.rows), row = q % G.rows;
    return [G.x0(col) + L.numW + L.r + a * L.gap, L.rowY0 + row * L.rowH];
  }

  // ===== Geração do PDF das folhas =====
  // prova: {id,nome,tipo,questoes,alternativas,valor}; estudantes: [{id,nome,turma}]
  // modo: '' (prova igual para todos), 'Q' (questões e alternativas embaralhadas), 'A' (só alternativas embaralhadas)
  function gerarPDF(prova, estudantes, jsPDF, qrcode, modo, cab) {
    var doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    var n = prova.questoes, alt = prova.alternativas, G = grade(n, alt, 2);
    function rotulo(t, x, y) { doc.setFont('helvetica', 'bold'); doc.setFontSize(6); doc.setTextColor(95); doc.text(t, x, y); doc.setTextColor(0); }
    function campo(t, x, y, w, tam, negrito) { doc.setFont('helvetica', negrito ? 'bold' : 'normal'); doc.setFontSize(tam); doc.text(cortar(doc, t, w), x, y); }
    estudantes.forEach(function (e, idx) {
      if (idx > 0) doc.addPage();
      doc.setTextColor(0); doc.setDrawColor(0); doc.setFillColor(0); doc.setLineWidth(0.3);
      // Marcas de canto (não mudar: a leitura da foto depende delas)
      L.mk.c.forEach(function (c) { doc.rect(c[0] - L.mk.s / 2, c[1] - L.mk.s / 2, L.mk.s, L.mk.s, 'F'); });

      // Cabeçalho institucional
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
      (cab && cab.length ? cab : ['ESCOLA']).slice(0, 4).forEach(function (t, i) { doc.text(cortar(doc, String(t).toUpperCase(), 132), 22, 24 + i * 3.4); });
      doc.setFontSize(14); doc.text('FOLHA DE RESPOSTAS', 22, 41.5);
      doc.setFontSize(9); doc.text(cortar(doc, String(prova.tipo || '').toUpperCase(), 60), 154, 41.5, { align: 'right' });

      // Quadro de identificação
      doc.setDrawColor(0); doc.setLineWidth(0.35); doc.rect(22, 44, 132, 25.5);
      doc.setLineWidth(0.2); doc.setDrawColor(110);
      doc.line(22, 52.5, 154, 52.5); doc.line(22, 61, 154, 61);
      doc.line(124, 44, 124, 52.5); doc.line(60, 61, 60, 69.5); doc.line(88, 61, 88, 69.5); doc.line(116, 61, 116, 69.5);
      rotulo('AVALIAÇÃO', 24, 46.6); campo(prova.nome, 24, 50.9, 98, 9.5);
      rotulo('TURMA', 126, 46.6); campo(e.turma || '', 126, 50.9, 26, 9.5, true);
      rotulo('ESTUDANTE', 24, 55.1); campo(e.nome, 24, 59.6, 128, 11, true);
      rotulo('DATA', 24, 63.6); campo('____/____/______', 24, 68, 34, 9);
      rotulo('VALOR', 62, 63.6); campo(fmt(prova.valor) + ' pontos', 62, 68, 24, 9.5);
      rotulo('QUESTÕES', 90, 63.6); campo(String(n) + ' (A a ' + LETRAS[alt - 1] + ')', 90, 68, 24, 9.5);
      rotulo('VERSÃO DA PROVA', 118, 63.6); campo(modo ? 'Individual' : 'Única', 118, 68, 34, 9.5, !!modo);

      // QR Code (identifica prova, estudante e versão; não mudar a posição)
      doc.setFillColor(0);
      var q = qrcode(0, 'M'); q.addData(codigoQR(prova.id, e.id, modo, 2)); q.make();
      var m = q.getModuleCount(), ms = L.qr.s / m;
      for (var r = 0; r < m; r++) for (var c = 0; c < m; c++)
        if (q.isDark(r, c)) doc.rect(L.qr.x + c * ms, L.qr.y + r * ms, ms + 0.02, ms + 0.02, 'F');

      // Quadro do professor (ao lado da identificação, abaixo do QR Code)
      doc.setDrawColor(0); doc.setLineWidth(0.35); doc.rect(158, 52.5, 32, 17);
      doc.setLineWidth(0.2); doc.setDrawColor(110); doc.line(158, 61, 190, 61);
      rotulo('ACERTOS', 160, 55.1); rotulo('NOTA', 160, 63.6);

      // Assinatura
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.text('ASSINATURA DO(A) ESTUDANTE:', 22, 74);
      doc.setDrawColor(0); doc.setLineWidth(0.2); doc.setLineDashPattern([0.6, 0.6], 0); doc.line(67, 74.3, 190, 74.3); doc.setLineDashPattern([], 0);

      // Instruções e exemplo de preenchimento
      doc.setFillColor(225); doc.rect(22, 76.5, 168, 4, 'F');
      doc.setDrawColor(0); doc.setLineWidth(0.35); doc.rect(22, 76.5, 168, 13.5);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6.8); doc.setTextColor(0);
      doc.text('INSTRUÇÕES PARA O PREENCHIMENTO', 24, 79.4); doc.text('EXEMPLO DE PREENCHIMENTO', 141, 79.4);
      var ins = [['Use caneta azul ou preta e pinte a bolinha inteira. Marque só UMA alternativa por questão.', false],
        modo ? ['PROVA INDIVIDUAL: marque na ordem da SUA prova. Duas marcações anulam a questão.', true]
          : ['Duas marcações ou rasura na mesma questão anulam a questão.', false],

        for (var d = -0.25; d <= 0.26; d += 0.25) {
          var p = aplicar(H, c[0] + (L.r + d) * Math.cos(t * Math.PI / 6), c[1] + (L.r + d) * Math.sin(t * Math.PI / 6)), x = Math.round(p[0]), y = Math.round(p[1]);
          if (x >= 0 && y >= 0 && x < P.w && y < P.h && P.b[y * P.w + x]) { esc++; break; }
        }
      }
    }
    return n ? esc / n : 0;
  }

  /* Lê as bolinhas de uma folha já identificada à mão (sem QR Code), usando só os 4 quadrados pretos.
     A posição da folha (foto girada) é descoberta pela mancha escura do QR Code, mesmo ilegível. */
  function lerSemQR(img, prova) {
    var P = preparar(img);
    if (!P.marcas) return { ok: false, erro: 'Não encontrei os 4 quadrados pretos dos cantos nesta foto.' };
    var Hs = homografias(P.marcas), best = -1, m = -1;
    Hs.forEach(function (H, k) { var v = manchaQR(P, H); if (v > m) { m = v; best = k; } });

    var lay = contorno(P, Hs[best], prova, 2) > contorno(P, Hs[best], prova, 1) ? 2 : 1;

  }

  function corrigir(respostas, gabarito, valor) {
    var n = gabarito.length, ac = 0;
    for (var i = 0; i < n; i++) if (gabarito[i] === '*' || respostas[i] === gabarito[i]) ac++;
    return { acertos: ac, nota: Math.round(ac * valor / n * 100) / 100 };
  }

 {k:'prova',n:'Prova Online',d:'Provas no tablet, com tempo e nota na hora',subs:[['prova','Provas','todos'],['aluno','Tela do estudante','todos']]},
 {k:'relatorios',n:'Relatórios',d:'Desenvolvimento de cada estudante',subs:[['relatorios','Escrever','todos'],['relver','Relatórios prontos','todos']]},
 {k:'ocorrencias',n:'Ocorrências',d:'Registro, histórico e pontuação',subs:[['ocnova','Nova ocorrência','todos'],['ochist','Histórico','todos'],['ocpontos','Pontuação','todos']]},
 {k:'config',n:'Configuração',d:'Estudantes, professores, horários e regras',subs:[['escola','Escola e regras','master'],['cprof','Professores','master'],['cturmas','Turmas','master'],['cest','Estudantes','master'],['chorario','Horário','master'],['importar','Importar planilhas','master'],['acessos','Pessoas e acessos','master'],['backup','Backup','master']]},
 {k:'ajuda',n:'Ajuda',d:'Tutorial passo a passo',subs:[['tutorial','Tutorial','todos']]}];
const podeVer=n=>n==='todos'||(n==='gestor'&&gestor())||(n==='master'&&isMaster());
const subsDe=m=>m.subs.filter(x=>podeVer(x[2])&&!(x[0]==='acessos'&&MODO!=='servidor'));
const modsVisiveis=()=>MODS.filter(m=>subsDe(m).length);
const modDe=v=>MODS.find(m=>m.subs.some(x=>x[0]===v));
function permitido(v){if(v==='inicio')return true;const m=modDe(v);return !!m&&subsDe(m).some(x=>x[0]===v)}
function saud(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function vInicio(){const ms=modsVisiveis(),hq=S.historico.some(q=>q.data===hoje());
 return `<h1>${saud()}${ME.nome?', '+esc(ME.nome.split(' ')[0]):''}</h1><p class="muted">${esc(S.escola||'Escolha um módulo para começar.')}</p>${hq?'<p><button class="tag t-w" style="border:0;cursor:pointer" data-act="go" data-v="hoje">Há quadro de substituição publicado para hoje</button></p>':''}${isMaster()?vAssistente()+(MODO==='local'&&vazio()?'<div class="card"><p>Quer ver o Prumo funcionando antes de cadastrar a sua escola?</p><div class="acts"><button class="b c" data-act="exemplo">Testar com escola de exemplo</button></div></div>':''):''}${MODO==='servidor'&&!gestor()&&ME.papel!=='aee'&&!S.professores.some(p=>p.nome===ME.nome)?'<div class="card" style="border-color:var(--coral)"><p><b>Seu nome não foi encontrado no cadastro de professores.</b> Por isso, você ainda não vê as suas turmas. Peça ao master da escola para ligar a sua conta ao seu nome em Configuração → Pessoas e acessos.</p></div>':''}
 <div class="mods">${ms.map(m=>`<button class="mod${m.k==='config'?' cfg':''}" data-act="go" data-v="${subsDe(m)[0][0]}"><span class="ico">${svgIc(m.k)}</span><b>${m.n}</b><span>${m.d}</span></button>`).join('')}</div>`}
function vazio(){return !S.professores.length||!S.horario.length}
const APP_URL='https://prumoapp2202-sudo.github.io/prumo/';
function textoConvite(){return `Olá! A ${S.escola||'escola'} está usando o Prumo (substituições, correção de provas, prova online, relatórios e ocorrências).\n\nPara entrar:\n1. Abra ${APP_URL}\n2. Clique em "Criar conta", use o seu e-mail, crie uma senha e aceite os termos.\n3. Confirme pelo link que chegar no seu e-mail.\n4. Entre no Prumo e, em "Entrar numa escola", digite o código ${ESCOLA_COD} e o seu nome completo, igual ao do cadastro da escola.`}
function passosConfig(){const ligados=MEMBROS.filter(m=>m.user_id!==ME.uid&&S.professores.some(p=>p.nome===m.nome)).length;
 const p=[{t:'Configure a escola',d:'Nome, cabeçalho da folha de respostas, turnos e horários, siglas do horário e regras.',ok:!!S.regrasOk,v:'escola',b:'Abrir Escola e regras'},
 {t:'Importe os professores',d:'Copie o modelo, preencha no Excel ou no Google Planilhas e cole no Prumo.',ok:S.professores.length>0,v:'importar',b:'Importar professores',x:S.professores.length?S.professores.length+' cadastrados':''},
 {t:'Importe turmas e estudantes',d:'Uma linha por estudante, com turma e turno.',ok:S.estudantes.length>0,v:'importar',b:'Importar estudantes',x:S.estudantes.length?S.estudantes.length+' estudantes em '+S.turmas.length+' turmas':''},
 {t:'Importe o quadro de horários',d:'Uma linha por professor e dia. É o horário que libera as substituições e mostra a cada professor as turmas dele.',ok:S.horario.length>0,v:'importar',b:'Importar horário'}];
 if(MODO==='servidor')p.push({t:'Convide os professores',d:'Mande a mensagem pronta pelo WhatsApp. Quem digitar o nome igual ao do cadastro é ligado sozinho.',ok:ligados>0,convite:true,x:ligados?ligados+' professor(es) já entraram e foram ligados':''});
 return p}
function vAssistente(){const p=passosConfig(),feitos=p.filter(x=>x.ok).length;if(feitos===p.length&&S.assistenteFechado)return '';
 const atual=p.findIndex(x=>!x.ok);
 return `<div class="card" style="border-color:var(--blue)"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${feitos===p.length?'Escola configurada':'Primeiros passos da escola'}</h2><span class="tag t-b">${feitos} de ${p.length}</span></div>
 <div style="height:8px;background:var(--grey);border-radius:6px;margin:12px 0 4px"><div style="height:8px;border-radius:6px;background:var(--blue);width:${Math.round(feitos/p.length*100)}%"></div></div>
 <ol class="steps" style="margin-top:14px">${p.map((x,i)=>`<li class="${x.ok?'feito':''}"><h3>${esc(x.t)}</h3><p class="small">${esc(x.d)}${x.x?' <b>'+esc(x.x)+'.</b>':''}</p>${x.convite?`<p class="small">Código da escola: <b style="font-size:18px;letter-spacing:2px">${esc(ESCOLA_COD)}</b></p><div class="acts"><button class="b s ${i===atual?'p':''}" data-act="copConvite">Copiar mensagem de convite</button><button class="b s" data-act="go" data-v="acessos">Ver quem entrou</button></div>`:`<button class="b s ${i===atual?'p':''}" data-act="go" data-v="${x.v}">${esc(x.b)}</button>`}</li>`).join('')}</ol>
 ${feitos===p.length?'<div class="acts"><button class="b" data-act="fecharAssistente">Fechar este quadro</button></div>':''}</div>`}
function semDados(titulo,txt){return `<div class="card empty"><h1>${esc(titulo)}</h1><p style="margin:auto">${esc(txt)}</p><div class="acts" style="justify-content:center">${isMaster()?`<button class="b p" data-act="go" data-v="tutorial">Abrir o tutorial</button>${MODO==='local'?'<button class="b" data-act="exemplo">Testar com escola de exemplo</button>':''}`:''}</div></div>`}

function vHoje(){
 if(!isCoord())return vHojeLeitura();
 if(vazio())return semDados('Quadro do dia','Para gerar substituições, o Prumo precisa dos professores e do quadro de horários.');
 if(!S.turnos[G.turno])G.turno=0;
 const t=G.turno,d=diaDaData(G.data),N=nAulas(t);
 let h=`<h1>Quadro do dia</h1><div class="card"><div class="row"><label>Data<input type="date" data-chg="gData" value="${esc(G.data)}"></label><label>Turno<select data-chg="gTurno">${S.turnos.map((x,i)=>`<option value="${i}"${i===t?' selected':''}>${esc(x.nome)}</option>`).join('')}</select></label>${d>=0?`<span class="tag t-b" style="margin-bottom:12px">${esc(dias()[d])}</span>`:''}</div>`;
 if(d<0)return h+`<p class="muted" style="margin-top:12px">Essa data cai num dia sem aulas configuradas. Escolha outra data.</p></div>`;
 const profs=S.professores.filter(p=>{for(let a=0;a<N;a++)if(classe(cel(p.nome,t,d,a)).k==='aula')return true;return false});
 h+=`<h2 style="margin-top:18px">Quem faltou?</h2><p class="muted small">Toque no nome. Se a falta for só em algumas aulas, desmarque as aulas em que o professor estará presente.</p><div class="chips">`;
 h+=profs.map(p=>{const on=!!G.aus[p.nome];let s=`<div class="prof${on?' on':''}"><button class="tog" aria-pressed="${on}" data-act="aus" data-p="${esc(p.nome)}">${esc(p.nome)}</button><span class="muted small">${esc(p.componente||'')}</span>`;
  if(on){const x=G.aus[p.nome];for(let a=0;a<N;a++){const c=classe(cel(p.nome,t,d,a));if(c.k!=='aula')continue;const sel=x.todo||x.aulas.includes(a);s+=`<button class="tog a" aria-pressed="${sel}" data-act="ausAula" data-p="${esc(p.nome)}" data-a="${a}">${a+1}ª · ${esc(c.turma)}</button>`}}
  return s+'</div>'}).join('')||'<p class="muted">Nenhum professor tem aula neste dia e turno.</p>';
 h+='</div></div>';
 const r=calcular();
 if(!r.itens.length)return h+(Object.keys(G.aus).length?'<div class="card"><p>As faltas marcadas não deixam turmas sem professor.</p></div>':'');
 const hs=horas(t),sem=r.itens.filter(i=>i.tipo==='sem').length,conf=r.itens.filter(i=>i.conflito).length;
 h+=`<div class="card"><h2>Substituições sugeridas</h2><p class="muted small">Ordem usada: plantão → horário livre → horário condicional (só se o professor tiver poucos no dia) → último recurso. Entre iguais, vai quem substituiu menos hoje e nos últimos 30 dias. Você pode trocar qualquer nome.</p>`;
 if(sem)h+=`<p class="tag t-c">${sem} aula(s) sem substituto</p> `;if(conf)h+=`<p class="tag t-c">${conf} conflito(s): a mesma pessoa em duas turmas no mesmo horário</p>`;
 h+=`<div class="scroll"><table class="stack"><thead><tr><th>Aula</th><th>Turma</th><th>Ausente</th><th>Substituto</th><th>Situação</th></tr></thead><tbody>`;
 h+=r.itens.map(i=>{const opts=[`<option value="">— sem substituto —</option>`].concat(i.cands.map(c=>`<option value="${esc(c.nome)}"${c.nome===i.sub?' selected':''}>${esc(c.nome)} · ${esc(c.tipoNome)}</option>`),S.reserva.map(rv=>`<option value="${esc(rv)}"${rv===i.sub?' selected':''}>${esc(rv)} · último recurso</option>`));
  if(i.sub&&!i.cands.some(c=>c.nome===i.sub)&&!S.reserva.includes(i.sub))opts.push(`<option selected value="${esc(i.sub)}">${esc(i.sub)}</option>`);
  const tag=i.conflito?'<span class="tag t-c">Conflito</span>':i.tipo==='sem'?'<span class="tag t-c">Sem substituto</span>':i.tipo==='reserva'?'<span class="tag t-w">Último recurso</span>':i.remanejar?'<span class="tag t-w">Remanejar horário</span>':'<span class="tag t-ok">'+esc(i.nota)+'</span>';
  return `<tr><td class="nw">${i.a+1}ª${hs[i.a]?' · '+esc(hs[i.a]):''}</td><td>${esc(i.turma)}</td><td>${esc(i.aus)}</td><td><select data-chg="sub" data-k="${esc(i.key)}" aria-label="Substituto">${opts.join('')}</select></td><td>${tag}</td></tr>`}).join('');
 h+=`</tbody></table></div><div class="acts noprint"><button class="b p" data-act="zap">Copiar para WhatsApp</button><button class="b" data-act="salvarQ">Salvar e publicar</button><button class="b" data-act="limparG">Recomeçar</button></div><p class="small muted">“Salvar e publicar” guarda no histórico${MODO==='servidor'?' e mostra o quadro para todos os professores da escola':''}.</p></div>`;
 h+=`<div class="card noprint"><h3>Prévia da mensagem</h3><pre class="zap">${esc(textoQuadro(G.data,t,r.itens))}</pre></div>`;
 return h}
function vHojeLeitura(){const qs=S.historico.filter(q=>q.data===G.data).sort((a,b)=>a.turno-b.turno);
 let h=`<h1>Quadro do dia</h1><div class="card"><div class="row"><label>Data<input type="date" data-chg="gData" value="${esc(G.data)}"></label></div></div>`;
 if(!qs.length)return h+'<div class="card"><p>Nenhum quadro de substituição publicado para esta data.</p></div>';
 return h+qs.map(q=>`<div class="card"><pre class="zap">${esc(textoQuadro(q.data,q.turno,q.itens))}</pre></div>`).join('')}

let Hv={modo:'prof',item:'',turno:0};

 if(!S.turnos[Hv.turno])Hv.turno=0;

  h+='</tr>'}
 h+=`</tbody></table></div><datalist id="dlCel">${S.turmas.map(x=>`<option value="${esc(x.nome)}">`).join('')}${S.tipos.map(x=>`<option value="${esc(x.sigla)}">${esc(x.nome)}</option>`).join('')}</datalist>`;

/* ---------- CORRETOR ---------- */
let K={av:null,aba:'notas',novo:false,fotos:[],manual:null,pdf:null};
function notaDe(av,resp){let ac=0;for(let q=0;q<av.nq;q++)if(resp[q]!=null&&resp[q]===av.gab[q])ac++;return{acertos:ac,nota:Math.round(ac/av.nq*(+av.valor||10)*10)/10}}
function vCorretor(){
 const turmas=minhasTurmas();
 if(K.novo)return vAvalForm();
 const av=S.avaliacoes.find(a=>a.id===K.av);
 if(!av){const l=S.avaliacoes.filter(a=>veTudo()||turmas.includes(a.turma)||a.autorUid===ME.uid).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  return `<h1>Corretor</h1><div class="card"><p>Crie a avaliação, imprima as folhas de resposta (cada uma com o nome do estudante e um QR Code) e corrija pela foto. Também dá para lançar as respostas tocando nas bolinhas.</p><div class="acts"><button class="b p" data-act="avNova"${S.estudantes.length?'':' disabled'}>Nova avaliação</button></div>${S.estudantes.length?'':'<p class="small muted">Cadastre turmas e estudantes primeiro.</p>'}</div>

 const ests=estDaTurma(av.turma),cs=S.correcoes.filter(c=>c.av===av.id);

 <div class="subtabs">${[['notas','Notas'],['foto','Corrigir por foto'],['folhas','Folhas de resposta'],['editar','Editar']].map(([k,n])=>`<button class="tog" aria-pressed="${K.aba===k}" data-act="kAba" data-k="${k}">${n}</button>`).join('')}</div>`;

   <p><b>${notaDe(av,K.manual.resp).acertos} acertos · nota ${num(notaDe(av,K.manual.resp).nota)}</b></p><div class="acts"><button class="b p" data-act="manSalvar">Salvar</button><button class="b" data-act="manCancel">Cancelar</button></div></div>`;return h}
  h+=`<div class="card"><div class="scroll"><table class="stack"><thead><tr><th>Estudante</th><th class="n">Acertos</th><th class="n">Nota</th><th>Origem</th><th></th></tr></thead><tbody>${ests.map(e=>{const c=cs.find(x=>x.est===e.id);return `<tr><td>${esc(e.nome)}</td><td class="n">${c?c.acertos+'/'+av.nq:''}</td><td class="n">${c?num(c.nota):''}</td><td>${c?(c.origem==='foto'?'<span class="tag t-b">Foto</span>':'<span class="tag t-ok">Manual</span>'):'<span class="tag t-w">Falta corrigir</span>'}</td><td><button class="b s" data-act="manAbrir" data-id="${e.id}">${c?'Ver/editar':'Lançar'}</button></td></tr>`}).join('')}</tbody></table></div>

 }else if(K.aba==='foto'){
  h+=`<div class="card"><h2>Corrigir por foto</h2><p>Fotografe cada folha de cima, com boa luz, mostrando os 4 quadrados pretos dos cantos. Pode enviar várias fotos de uma vez.</p><div class="acts"><label class="b p">Escolher ou tirar fotos<input class="hid" type="file" accept="image/*" multiple data-chg="fotos"></label></div></div>`;

function parseLote(txt){const out=[];for(const bloco of String(txt).replace(/\r/g,'').split(/\n\s*\n/)){const ls=bloco.split('\n').map(s=>s.trim()).filter(Boolean);if(!ls.length)continue;const q={e:'',alts:[],certa:null};const en=[];for(const l of ls){const m=l.match(/^(\*?)\s*([a-eA-E])\s*[\)\.\-]\s*(.*)$/);if(m&&(q.alts.length||en.length)){if(m[1])q.certa=q.alts.length;q.alts.push(m[3].replace(/^\*\s*/,''));const lastStar=/\*\s*$/.test(m[3]);if(lastStar){q.certa=q.alts.length-1;q.alts[q.alts.length-1]=q.alts[q.alts.length-1].replace(/\s*\*\s*$/,'')}}else en.push(l)}
 q.e=en.join('\n').replace(/^\d+\s*[\)\.\-]\s*/,'');if(q.alts.length>=2){while(q.alts.length<4)q.alts.push('');out.push(q)}}return out}
function embaralhar(arr,seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;const a=arr.slice();for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);const t=a[i];a[i]=a[j];a[j]=t}return a}

 par.push(`No ${per}, ${nome}, da turma ${e.turma}, foi acompanhado(a) por ${lista(cs.map(c=>c.prof+(c.componente?' ('+c.componente+')':'')))}.`);
 const uni=k=>[...new Set(cs.flatMap(c=>c.marcados?.[k]||[]))].map(minusc);
 const b=uni('barreiras');if(b.length)par.push(`Foram observadas as seguintes barreiras à aprendizagem: ${lista(b)}.`);
 for(const c of cs){const it=Object.entries(c.itens||{});if(!it.length)continue;const g=s=>it.filter(([,v])=>v===s).map(([k])=>'“'+minusc(k)+'”');const fr=[];if(g(SIT[0]).length)fr.push(`já consolidou ${lista(g(SIT[0]))}`);if(g(SIT[1]).length)fr.push(`está consolidando ${lista(g(SIT[1]))}`);if(g(SIT[2]).length)fr.push(`ainda não consolidou ${lista(g(SIT[2]))}`);if(fr.length)par.push(`Em ${c.componente||'sala'}, quanto às aprendizagens do ano, ${pn} ${fr.join('; ')}.`)}
 const a=uni('adaptacoes');if(a.length)par.push(`Para favorecer a aprendizagem, foram realizadas as seguintes adaptações: ${lista(a)}.`);
 const ac=uni('acessibilidade');if(ac.length)par.push(`Como recursos de acessibilidade, foram utilizados: ${lista(ac)}.`);
 if(cs.some(c=>c.aee==='sim'))par.push(`${pn} frequenta o Atendimento Educacional Especializado (AEE).`);
 const iv=uni('intervencoes');if(iv.length)par.push(`As intervenções realizadas foram: ${lista(iv)}.`);
 for(const c of cs)if((c.consideracao||'').trim())par.push(`${c.prof}${c.componente?', de '+c.componente:''}, considera: ${c.consideracao.trim()}`);
 return `RELATÓRIO DE DESENVOLVIMENTO — ${per.toUpperCase()}\n${S.escola||''}\nEstudante: ${nome} · Turma: ${e.turma}\n\n`+par.join('\n\n')}

function relHTML(r){const lim=a=>a.slice(0,25).map(x=>`<li>${esc(x)}</li>`).join('')+(a.length>25?`<li>… e mais ${a.length-25}</li>`:'');
 let h='';if(r.erros.length)h+=`<div class="rel err"><b>${r.erros.length} erro(s) — corrija na planilha e cole de novo:</b><ul>${lim(r.erros)}</ul></div>`;
 if(r.alertas.length)h+=`<div class="rel w"><b>Atenção:</b><ul>${lim(r.alertas)}</ul></div>`;
 if(!r.erros.length)h+=`<div class="rel ok"><b>Tudo certo para importar:</b> ${esc(r.resumo)}. A importação substitui o que já existe neste bloco.</div>`;return h}
function parse(txt){txt=String(txt||'').replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const del=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',');
 const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"'&&f==='')q=true;else if(c===del){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 row.push(f);rows.push(row);return rows.map(r=>r.map(x=>x.trim()))}
function linhas(txt){const rows=parse(txt);let off=1;if(rows.length&&/nome|professor|estudante/.test(norm(rows[0][0]))){rows.shift();off=2}return rows.map((r,i)=>({r,ln:i+off})).filter(o=>o.r.some(x=>x))}
function valProf(txt){const erros=[],alertas=[],out=[],vis=new Set();for(const{r,ln}of linhas(txt)){const nome=r[0]?.replace(/\s+/g,' ');if(!nome){erros.push(`Linha ${ln}: falta o nome.`);continue}if(vis.has(norm(nome))){erros.push(`Linha ${ln}: “${nome}” aparece duas vezes.`);continue}vis.add(norm(nome));out.push({nome,componente:r[1]||'',telefone:r[2]||''})}
 if(!out.length&&!erros.length)erros.push('Não encontrei nenhuma linha preenchida.');
 const sai=[...new Set(S.horario.map(h=>h.prof))].filter(p=>!vis.has(norm(p)));if(sai.length)alertas.push('Estes professores não estão na nova lista e o horário deles será apagado: '+sai.join(', '));
 return{erros,alertas,resumo:out.length+' professor(es)',aplicar(){for(const p of out){const ant=S.professores.find(x=>norm(x.nome)===norm(p.nome));if(ant)p.id=ant.id}const ren=new Map();for(const p of out){const ant=S.horario.find(h=>norm(h.prof)===norm(p.nome));if(ant)ren.set(ant.prof,p.nome)}S.horario=S.horario.filter(h=>ren.has(h.prof)).map(h=>Object.assign(h,{prof:ren.get(h.prof)}));S.professores=out}}}
function valEst(txt){const erros=[],alertas=[],out=[],tur=new Map();for(const t of S.turmas)tur.set(kT(t.nome),{nome:t.nome,turno:t.turno,id:t.id});
 for(const{r,ln}of linhas(txt)){const nome=(r[0]||'').replace(/\s+/g,' '),tn=r[1]||'';if(!nome||!tn){erros.push(`Linha ${ln}: falta ${!nome?'o nome':'a turma'}.`);continue}const t=turnoIdx(r[2]);if(t<0){erros.push(`Linha ${ln}: turno “${r[2]||''}” não existe (turnos: ${S.turnos.map(x=>x.nome).join(', ')}).`);continue}
  if(tipoPorSigla(tn)){erros.push(`Linha ${ln}: a turma “${tn}” tem o mesmo nome de uma sigla. Mude o nome da turma ou da sigla.`);continue}
  const k=kT(tn),ex=tur.get(k);if(ex&&ex.turno!==t){erros.push(`Linha ${ln}: a turma ${tn} aparece em dois turnos.`);continue}if(!ex)tur.set(k,{nome:tn,turno:t,nova:true});out.push({nome,turma:(ex||tur.get(k)).nome})}
 if(!out.length&&!erros.length)erros.push('Não encontrei nenhuma linha preenchida.');
 const novas=[...tur.values()].filter(x=>x.nova);if(novas.length)alertas.push('Turmas novas: '+novas.map(x=>x.nome).join(', '));
 return{erros,alertas,resumo:out.length+' estudante(s) em '+new Set(out.map(o=>o.turma)).size+' turma(s)',aplicar(){for(const e of out){const ant=S.estudantes.find(x=>norm(x.nome)===norm(e.nome)&&x.turma===e.turma);if(ant)e.id=ant.id}S.turmas=[...tur.values()].map(x=>({id:x.id,nome:x.nome,turno:x.turno}));S.estudantes=out}}}
function valHor(txt){const erros=[],alertas=[],out=[],vis=new Set(),novas=new Map(),slot=new Map();
 if(!S.professores.length)return{erros:['Importe primeiro os professores (bloco 1).'],alertas,resumo:''};
 const sig=S.tipos.map(x=>x.sigla).join(', ');
 const turmaK=c=>{const tu=turmaPor(c);if(tu)return{nome:tu.nome,turno:tu.turno};return novas.get(kT(c))};
 for(const{r,ln}of linhas(txt)){const[pn,tn,dn,...cs]=r;const p=S.professores.find(x=>norm(x.nome)===norm(pn));if(!p){erros.push(`Linha ${ln}: o professor “${pn||''}” não está cadastrado. Confira se o nome está igual ao da lista de professores.`);continue}
  const t=turnoIdx(tn);if(t<0){erros.push(`Linha ${ln}: turno “${tn||''}” não existe.`);continue}const d=diaIdx(dn);if(d<0){erros.push(`Linha ${ln}: dia “${dn||''}” não reconhecido (use Segunda, Terça…).`);continue}
  const key=p.nome+'|'+t+'|'+d;if(vis.has(key)){erros.push(`Linha ${ln}: ${p.nome} aparece duas vezes em ${S.turnos[t].nome}, ${dias()[d]}.`);continue}vis.add(key);
  const n=nAulas(t),aulas=Array(n).fill('');
  cs.forEach((c,ci)=>{c=String(c||'').trim();if(!c)return;if(ci>=n){erros.push(`Linha ${ln}: há algo na ${ci+1}ª aula, mas o turno ${S.turnos[t].nome} tem ${n} aulas.`);return}
   let cl=classe(c);if(cl.k==='erro'){if(/\d/.test(c)){const ex=novas.get(kT(c));if(!ex)novas.set(kT(c),{nome:c,turno:t});else if(ex.turno!==t){erros.push(`Linha ${ln}: a turma ${c} aparece em dois turnos.`);return}}else{erros.push(`Linha ${ln}, ${ci+1}ª aula: “${c}” não é turma nem sigla. Siglas válidas: ${sig}.`);return}}
   const tk=turmaK(c);if(tk){if(tk.turno!==t){erros.push(`Linha ${ln}: a turma ${tk.nome} é do turno ${S.turnos[tk.turno]?.nome}, não de ${S.turnos[t].nome}.`);return}const sk=t+'|'+d+'|'+ci+'|'+kT(tk.nome);slot.set(sk,(slot.get(sk)||[]).concat(p.nome))}
   aulas[ci]=c});
  const ant=linha(p.nome,t,d);out.push({id:ant?.id,prof:p.nome,turno:t,dia:d,aulas})}
 if(!out.length&&!erros.length)erros.push('Não encontrei nenhuma linha preenchida.');
 for(const[k,ps]of slot)if(ps.length>1){const[t,d,a,tk]=k.split('|');alertas.push(`${dias()[+d]}, ${+a+1}ª aula: ${ps.join(' e ')} na mesma turma (${(turmaK(tk)||{}).nome||tk}). Se não for aula compartilhada, corrija.`)}
 const todas=S.turmas.map(x=>({nome:x.nome,turno:x.turno})).concat([...novas.values()]);
 for(const tu of todas){let falta=0,tem=0;for(let d=0;d<dias().length;d++)for(let a=0;a<nAulas(tu.turno);a++){if(slot.has(tu.turno+'|'+d+'|'+a+'|'+kT(tu.nome)))tem++;else falta++}
  if(!tem)alertas.push(`A turma ${tu.nome} não aparece no horário.`);else if(falta)alertas.push(`Turma ${tu.nome}: ${falta} horário(s) sem professor no quadro.`)}
 if(novas.size)alertas.push('Turmas que não estavam cadastradas e serão criadas: '+[...novas.values()].map(x=>x.nome).join(', '));
 const sem=S.professores.filter(p=>!out.some(o=>o.prof===p.nome)).map(p=>p.nome);if(sem.length&&out.length)alertas.push('Professores sem nenhuma linha de horário: '+sem.join(', '));
 return{erros,alertas,resumo:out.length+' linha(s) de horário de '+new Set(out.map(o=>o.prof)).size+' professor(es)',aplicar(){for(const x of novas.values())S.turmas.push(x);S.horario=out.map(o=>{if(!o.id)delete o.id;return o})}}}

function lerTexto(f,cod){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=()=>ok('');r.readAsText(f,cod)})}
async function lerArquivo(f){if(/\.xlsx?$/i.test(f.name)){const X=await carregar(LIB_XLSX,'XLSX');const wb=X.read(await f.arrayBuffer(),{type:'array'});return X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:'\t',blankrows:false})}
 let t=await lerTexto(f,'utf-8');if(t.includes(String.fromCharCode(65533)))t=await lerTexto(f,'windows-1252');return t}

 n.sabado=!!$('rSab')?.checked;const ls=s=>String(s).split('\n').map(x=>x.trim()).filter(Boolean);
 n.reserva=ls(v('rRes'));if($('rCab'))n.cabecalho=ls(v('rCab')).slice(0,4);if($('rPeriodos'))n.periodos=ls(v('rPeriodos'));
 document.querySelectorAll('[data-lst]').forEach(el=>{n.listas[el.dataset.lst]=ls(el.value)});

 if(!l.length)return h+'<p class="muted" style="margin-top:12px">Nenhum quadro salvo ainda.</p></div>';

 const nomes=[...new Set([...sub.keys(),...fal.keys()])].sort((a,b)=>(sub.get(b)||0)-(sub.get(a)||0)||a.localeCompare(b));

 h+=l.map(q=>`<details><summary>${dataBR(q.data)} · ${esc(S.turnos[q.turno]?.nome||'')} · ${q.itens.length} substituição(ões)</summary><div class="scroll"><table class="stack small" style="margin-top:8px"><thead><tr><th>Aula</th><th>Turma</th><th>Ausente</th><th>Substituto</th></tr></thead><tbody>${q.itens.map(i=>`<tr><td>${i.a+1}ª</td><td>${esc(i.turma)}</td><td>${esc(i.aus)}</td><td>${esc(i.sub||'sem substituto')}</td></tr>`).join('')}</tbody></table></div><div class="acts"><button class="b s" data-act="delHist" data-id="${q.id}">Apagar este quadro</button></div></details>`).join('');
 return h}

['1. O que é o Prumo','O Prumo é um sistema on-line de gestão escolar, com módulos de substituições, correção de provas, prova online, relatórios de desenvolvimento e registro de ocorrências. Ele foi desenvolvido e é mantido por Pedro Motta, aqui chamado de desenvolvedor. Ao criar uma conta ou usar o Prumo, você declara que leu e aceita estes termos.'],
['2. Quem pode usar','O Prumo é destinado a profissionais de escolas cadastradas. Cada conta é pessoal e intransferível, e a senha não deve ser compartilhada. O usuário master de cada escola é responsável pelas pessoas a quem libera o acesso e pelos papéis que atribui a elas.'],
['3. Quais dados são tratados','O Prumo trata dados de profissionais (nome, e-mail, componente curricular, telefone opcional e horário de trabalho) e dados de estudantes (nome, turma, respostas e notas de avaliações, registros de ocorrências e relatórios de desenvolvimento, que podem conter informações sobre necessidades educacionais específicas). O Prumo não solicita CPF, endereço nem documentos pessoais, e esses dados não devem ser cadastrados.'],
['4. Responsabilidades segundo a LGPD','Nos termos da Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018), a escola, ou a rede de ensino a que ela pertence, é a controladora dos dados: ela decide quais dados cadastrar e para qual finalidade, e responde pela base legal do tratamento e pela informação às famílias, inclusive quanto aos dados de crianças e adolescentes (art. 14). O desenvolvedor atua como operador, tratando os dados apenas para fazer o sistema funcionar, conforme as instruções da escola.'],
['5. Para que os dados são usados','Os dados são usados exclusivamente para as funções pedagógicas e administrativas da escola dentro do Prumo. Eles não são vendidos, não são compartilhados com terceiros para publicidade e não são usados para treinar sistemas de inteligência artificial.'],
['6. Onde os dados ficam e como são protegidos','Os dados ficam em servidor contratado pelo desenvolvedor (Supabase), localizado no Brasil, em São Paulo. Cada escola tem um espaço próprio, isolado pelo próprio banco de dados: usuários de uma escola não conseguem ler, alterar nem apagar dados de outra. O acesso exige e-mail e senha, e a comunicação com o servidor é criptografada. Estudantes acessam apenas a própria prova, com o código da prova e um PIN individual, e nunca recebem o gabarito.'],
['7. Acesso do desenvolvedor','Para manutenção, correção de falhas e suporte, o desenvolvedor pode acessar os dados de qualquer escola. Esse acesso é limitado ao necessário para essas finalidades, e o desenvolvedor mantém sigilo sobre as informações a que tiver acesso.'],

['9. Guarda e exclusão dos dados','Os dados ficam guardados enquanto a escola usar o Prumo. Se a escola encerrar o uso, ela pode exportar seus dados pelo backup e pedir a exclusão, que será feita em até 30 dias após o pedido.'],

['11. Propriedade intelectual e proibição de cópia','O Prumo, incluindo seu código, telas, layout, folhas de resposta, textos, nome e marca, é obra do desenvolvedor, protegida pela Lei nº 9.609/1998 (programas de computador) e pela Lei nº 9.610/1998 (direitos autorais). O uso do Prumo é uma licença pessoal, não exclusiva e intransferível, limitada a utilizá-lo pelo endereço oficial. Sem autorização por escrito do desenvolvedor, é proibido: copiar, reproduzir, modificar, adaptar, traduzir ou distribuir o aplicativo ou qualquer parte dele; criar aplicativo derivado ou semelhante a partir dele; fazer engenharia reversa; hospedar cópia do aplicativo em outro endereço; e remover ou alterar a assinatura “Desenvolvido por Pedro Motta”. A violação pode resultar no bloqueio do acesso e nas medidas judiciais cabíveis.'],
['12. Disponibilidade','O desenvolvedor busca manter o Prumo funcionando, mas pode haver interrupções para manutenção ou por falhas de serviços de terceiros. Recomenda-se que o master faça backup periódico em Configuração → Backup. O Prumo é uma ferramenta de apoio: as decisões pedagógicas e administrativas continuam sendo da escola e de seus profissionais.'],

 /* login */

  if(AU.modo==='criar'&&!$('auTermos')?.checked){AU.erro='Para criar a conta, leia e marque que aceita os Termos de uso.';return render()}
  const r=AU.modo==='criar'?await sb.auth.signUp({email,password:senha,options:{data:{termos:TERMOS_V}}}):await sb.auth.signInWithPassword({email,password:senha});
  if(r.error){AU.erro=AU.modo==='criar'?'Não consegui criar a conta: '+r.error.message:'E-mail ou senha incorretos.';return render()}
  if(AU.modo==='criar'&&!r.data.session){AU.modo='entrar';AU.erro='';toast('Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.');return render()}AU.erro='';iniciarServidor()},
 auEsqueci:async()=>{const email=$('auEmail').value.trim();if(!email)return toast('Escreva o seu e-mail acima.');await clienteSB();await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});toast('Se o e-mail estiver cadastrado, você vai receber um link.')},
 esEntrar:async()=>{const cod=$('esCod').value.trim().toUpperCase(),nome=$('esNome').value.trim();if(!cod||!nome){AU.erro='Preencha o código e o seu nome.';return render()}const{data,error}=await sb.rpc('prumo_entrar_escola',{p_codigo:cod,p_nome:nome});if(error||!data){AU.erro='Código não encontrado.';return render()}iniciarServidor()},
 esCriar:async()=>{const esc2=$('esEscola').value.trim(),nome=$('esNome2').value.trim();if(!esc2||!nome){AU.erro='Preencha o nome da escola e o seu nome.';return render()}const{error}=await sb.rpc('prumo_criar_escola',{p_nome:esc2,p_meu_nome:nome});if(error){AU.erro='Não consegui cadastrar: '+error.message;return render()}S.escola=esc2;await iniciarServidor();save()},

 sair:async()=>{try{sessionStorage.removeItem('prumo.devEscola')}catch(e){}if(sb)await sb.auth.signOut();location.hash='';location.reload()},
 mRemover:async b=>{const m=MEMBROS[+b.dataset.i];if(!m||!confirma(b,'m'+m.user_id))return;const{error}=await sb.from('membros').delete().eq('escola_id',ESCOLA).eq('user_id',m.user_id);if(error)return toast('Não consegui remover.');await carregarMembros();render()}};
function gravarCorrecao(av,est,resp,origem){const n=notaDe(av,resp);const id=av.id+'_'+est;const c=S.correcoes.find(x=>x.id===id);const d={id,av:av.id,est,resp:resp.slice(),acertos:n.acertos,nota:n.nota,origem,autorUid:ME.uid};if(c)Object.assign(c,d);else S.correcoes.push(d)}
function retomarProva(){try{const a=JSON.parse(localStorage.getItem(AND)||'null');if(a&&a.fimEm>Date.now()-5*60000){AL=Object.assign({fase:'prova',erro:''},a);if(AL.fimEm<Date.now())AL.fimEm=Date.now()+15000}}catch(e){}}

 cel:el=>{const t=Hv.turno,d=+el.dataset.d,a=+el.dataset.a,v=el.value.trim();let l=linha(Hv.item,t,d);if(!l){l={id:uid(),prof:Hv.item,turno:t,dia:d,aulas:Array(nAulas(t)).fill('')};S.horario.push(l)}while(l.aulas.length<nAulas(t))l.aulas.push('');l.aulas[a]=v;const c=classe(v);save();render();if(c.k==='erro')toast(`“${v}” não é turma nem sigla.`)},

 avTurma:el=>{const av=avEdit();av.turma=el.value},

 avNa:el=>{const av=avEdit();av.na=+el.value;av.gab=av.gab.map(g=>g!=null&&g>=av.na?null:g);if(!K.novo)save();render()},
 fotos:async el=>{const av=avEdit();const fs=[...(el.files||[])];if(!fs.length)return;toast('Lendo '+fs.length+' foto(s)…');for(const f of fs){const r=await lerFoto(f,av);if(!r.erro&&r.est&&!estPorId(r.est))r.est='';K.fotos.push(r)}render()},
 fotoEst:el=>{K.fotos[+el.dataset.i].est=el.value;render()},
 rTurma:el=>{R.turma=el.value;R.est='';render()},rEst:el=>{R.est=el.value;render()},rPer:el=>{R.periodo=el.value;render()},rProf:el=>{R.prof=el.value;render()},

 oTurma:el=>{O.turma=el.value;O.sel=[];render()},
 oFT:el=>{O.filtroT=el.value;O.filtroE='';render()},oFE:el=>{O.filtroE=el.value;render()},oPT:el=>{O.pontosT=el.value;render()},
 mNome:async el=>{const m=MEMBROS[+el.dataset.i];const{error}=await sb.from('membros').update({nome:el.value}).eq('escola_id',ESCOLA).eq('user_id',m.user_id);if(error)toast('Não consegui salvar.');else{m.nome=el.value;toast('Salvo.')}},
 mPapel:async el=>{const m=MEMBROS[+el.dataset.i];const{error}=await sb.from('membros').update({papel:el.value}).eq('escola_id',ESCOLA).eq('user_id',m.user_id);if(error)toast('Não consegui salvar.');else{m.papel=el.value;toast('Papel alterado.')}}};
const I={

 lote:el=>{P.lote=el.value},

document.addEventListener('click',e=>{const t=e.target.closest('#tabs button[data-v]');if(t)return go(t.dataset.v);const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act]&&!b.disabled)A[b.dataset.act](b,e)});
$('app').addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&C[el.dataset.chg])C[el.dataset.chg](el,e);const oe=e.target.closest('[data-oe]');if(oe){O.sel=[...document.querySelectorAll('[data-oe]:checked')].map(x=>x.dataset.oe)}});
$('app').addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el&&I[el.dataset.inp])I[el.dataset.inp](el,e)});

window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(views[v]&&v!==view){if(v==='aluno'){AL={fase:'entrar',erro:''};retomarProva()}if(v==='termos')antesTermos=view;view=v;render();window.scrollTo(0,0)}});

setInterval(atualizarDoServidor,60000);

{const v=location.hash.slice(1);if(v==='aluno')retomarProva();
 if(MODO==='local'){try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(padrao(),JSON.parse(t))}catch(e){}ids();view=views[v]&&!['entrar','escolher'].includes(v)?v:'inicio';render()}
 else{$('app').innerHTML='<div class="card auth"><p>Carregando…</p></div>';if(v==='aluno'){view='aluno';render()}else iniciarServidor()}}
