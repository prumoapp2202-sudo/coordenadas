function docsAtuais(){const m=new Map();const cfg={};for(const k of CFG)cfg[k]=S[k];if(podeColecao('config'))m.set('config|config',JSON.stringify(cfg));for(const c of COLS){if(!podeColecao(c))continue;for(const d of S[c]){if(!isCoord()&&d.autorUid&&d.autorUid!==ME.uid)continue;m.set(c+'|'+d.id,JSON.stringify(d))}}return m}

let syncT,syncando=false,pend=false;
function setSync(t){const el=$('sync');if(el)el.textContent=t}
function agendarSync(){pend=true;setSync('Salvando…');clearTimeout(syncT);syncT=setTimeout(sync,600)}
async function sync(){if(syncando){syncT=setTimeout(sync,600);return}syncando=true;pend=false;const atual=docsAtuais();const up=[],del={};
 for(const[k,v]of atual)if(snap.get(k)!==v)up.push(k);
 for(const k of snap.keys()){const c=k.split('|')[0];if(!atual.has(k)&&podeColecao(c)){const d=k.slice(c.length+1);const own=!isCoord()?S[c]?.some(x=>x.id===d):false;if(!own&&(isCoord()||JSON.parse(snap.get(k)).autorUid===ME.uid))(del[c]||(del[c]=[])).push(d)}}
 try{for(let i=0;i<up.length;i+=300){const rows=up.slice(i,i+300).map(k=>{const c=k.split('|')[0];return{escola_id:ESCOLA,colecao:c,id:k.slice(c.length+1),doc:JSON.parse(atual.get(k)),atualizado_em:new Date().toISOString()}});const{error}=await sb.from('dados').upsert(rows);if(error)throw error;rows.forEach(r=>snap.set(r.colecao+'|'+r.id,JSON.stringify(r.doc)))}
  for(const c in del)for(let i=0;i<del[c].length;i+=200){const part=del[c].slice(i,i+200);const{error}=await sb.from('dados').delete().eq('escola_id',ESCOLA).eq('colecao',c).in('id',part);if(error)throw error;part.forEach(d=>snap.delete(c+'|'+d))}
  setSync('Salvo')}catch(e){setSync('Erro ao salvar');toast('Não consegui salvar no servidor: '+(e.message||e))}syncando=false}
async function carregarServidor(){let all=[],from=0;for(;;){const{data,error}=await sb.from('dados').select('colecao,id,doc').eq('escola_id',ESCOLA).range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
 const n=padrao();snap=new Map();for(const r of all){if(r.colecao==='config')for(const k of CFG){if(r.doc[k]!==undefined)n[k]=r.doc[k]}else if(n[r.colecao])n[r.colecao].push(r.doc);snap.set(r.colecao+'|'+r.id,JSON.stringify(r.doc))}S=n}
async function atualizarDoServidor(){if(MODO!=='servidor'||!ESCOLA||pend||syncando)return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;try{await carregarServidor();if(['inicio','hoje','corretor','prova','relatorios','relver','ochist','ocpontos','historico'].includes(view))render()}catch(e){}}

/* ---------- consultas ---------- */
function tipoPorSigla(s){const k=kT(s);return k?S.tipos.find(t=>kT(t.sigla)===k):null}
function turmaPor(s){const k=kT(s);return k?S.turmas.find(t=>kT(t.nome)===k):null}
function classe(v){v=String(v??'').trim();if(!v)return{k:'vazio'};const tp=tipoPorSigla(v);if(tp)return{k:'tipo',tipo:tp};const tu=turmaPor(v);if(tu)return{k:'aula',turma:tu.nome};return{k:'erro',v}}
function linha(p,t,d){return S.horario.find(h=>h.prof===p&&h.turno===t&&h.dia===d)}
function cel(p,t,d,a){const l=linha(p,t,d);return l?(l.aulas[a]||''):''}
function turnoIdx(s){const n=norm(s);if(!n)return S.turnos.length===1?0:-1;return S.turnos.findIndex(t=>{const m=norm(t.nome);return m===n||m.startsWith(n)})}
function diaIdx(s){const n=norm(s).replace(/-?feira/,'');if(!n)return -1;const m=n.match(/^([2-7])/);if(m){const i=+m[1]-2;return i<dias().length?i:-1}return dias().findIndex(d=>norm(d).slice(0,3)===n.slice(0,3))}
function diaDaData(s){if(!s)return -1;const w=new Date(s+'T12:00:00').getDay();if(w===0)return -1;const i=w-1;return i<dias().length?i:-1}
function aulasSemana(p){let n=0;for(const h of S.horario)if(h.prof===p)for(const x of h.aulas)if(classe(x).k==='aula')n++;return n}
function turmasDoProf(p){const s=new Set();for(const h of S.horario)if(h.prof===p)for(const x of h.aulas){const c=classe(x);if(c.k==='aula')s.add(c.turma)}return[...s]}
function minhasTurmas(){if(veTudo())return S.turmas.map(t=>t.nome);return turmasDoProf(ME.nome)}
const estDaTurma=t=>S.estudantes.filter(e=>e.turma===t).sort((a,b)=>a.nome.localeCompare(b.nome));
const estPorId=id=>S.estudantes.find(e=>e.id===id);
const meuNome=()=>ME.nome||(MODO==='local'?'Coordenação':ME.email);
const podeEditar=d=>isCoord()||MODO==='local'||(d.autorUid&&d.autorUid===ME.uid);
function selTurma(chg,val,turmas,vazio){return `<select data-chg="${chg}">${vazio?`<option value="">${esc(vazio)}</option>`:''}${turmas.map(t=>`<option${t===val?' selected':''}>${esc(t)}</option>`).join('')}</select>`}

/* ---------- substituições ---------- */
let G={data:hoje(),turno:0,aus:{},esc:{}};
function ausenteEm(p,a){const x=G.aus[p];return !!x&&(x.todo||x.aulas.includes(a))}
function histCont(){const m=new Map(),lim=Date.now()-30*864e5;for(const h of S.historico){if(new Date(h.data+'T12:00:00').getTime()<lim)continue;for(const it of h.itens)if(it.tipo==='prof')m.set(it.sub,(m.get(it.sub)||0)+1)}return m}
function candidatos(t,d,a){const out=[];for(const p of S.professores){if(ausenteEm(p.nome,a))continue;const c=classe(cel(p.nome,t,d,a));if(c.k!=='tipo')continue;const tp=c.tipo;let rank;
 if(tp.papel==='prioritario')rank=0;else if(tp.papel==='disponivel')rank=1;else if(tp.papel==='condicional'){let n=0;S.turnos.forEach((_,ti)=>{const l=linha(p.nome,ti,d);if(l)for(const x of l.aulas)if(kT(x)===kT(tp.sigla))n++});if(n>(+tp.limite||0))continue;rank=2}else continue;
 out.push({nome:p.nome,rank,tipoNome:tp.nome,remanejar:rank===2})}return out}
function calcular(){const t=G.turno,d=diaDaData(G.data);if(d<0||!S.turnos[t])return{d,itens:[]};const N=nAulas(t),needs=[];
 for(const p of Object.keys(G.aus))for(let a=0;a<N;a++){if(!ausenteEm(p,a))continue;const c=classe(cel(p,t,d,a));if(c.k==='aula')needs.push({a,turma:c.turma,aus:p})}
 needs.sort((x,y)=>x.a-y.a||x.turma.localeCompare(y.turma));
 const hc=histCont(),dia=new Map(),usados={},itens=[];
 for(const n of needs){const set=usados[n.a]||(usados[n.a]=new Set());const cands=candidatos(t,d,n.a);const key=n.a+'|'+n.turma+'|'+n.aus;let sub,tipo,nota,remanejar=false;
  if(Object.prototype.hasOwnProperty.call(G.esc,key)){sub=G.esc[key];const c=cands.find(x=>x.nome===sub);if(c){tipo='prof';nota=c.tipoNome;remanejar=c.remanejar}else if(sub&&S.reserva.includes(sub)){tipo='reserva';nota='Último recurso'}else if(sub){tipo='prof';nota='Escolha manual'}else{tipo='sem';nota='Sem substituto'}}
  else{const ord=cands.filter(c=>!set.has(c.nome)).sort((x,y)=>x.rank-y.rank||(dia.get(x.nome)||0)-(dia.get(y.nome)||0)||(hc.get(x.nome)||0)-(hc.get(y.nome)||0)||x.nome.localeCompare(y.nome));
   if(ord.length){sub=ord[0].nome;tipo='prof';nota=ord[0].tipoNome;remanejar=ord[0].remanejar}else{const r=S.reserva.find(r=>!set.has(r));if(r){sub=r;tipo='reserva';nota='Último recurso'}else{sub='';tipo='sem';nota='Sem substituto'}}}
  const conflito=!!sub&&set.has(sub);if(sub)set.add(sub);if(tipo==='prof'&&sub)dia.set(sub,(dia.get(sub)||0)+1);
  itens.push(Object.assign({},n,{key,sub,tipo,nota,remanejar,cands,conflito}))}
 return{d,itens}}
function textoQuadro(data,turno,itens){const hs=horas(turno),aus=[...new Set(itens.map(i=>i.aus))];let s='*Quadro de substituição'+(S.escola?' — '+S.escola:'')+'*\n'+(dias()[diaDaData(data)]||'')+', '+dataBR(data)+' · '+(S.turnos[turno]?.nome||'')+'\nAusentes: '+aus.join(', ')+'\n';
 for(const i of itens)s+='\n'+(i.a+1)+'ª aula'+(hs[i.a]?' ('+hs[i.a]+')':'')+' · '+i.turma+': '+(i.sub||'SEM SUBSTITUTO')+(i.remanejar?' (remanejar o horário dele no dia)':'');return s}

  if(on){const x=G.aus[p.nome];for(let a=0;a<N;a++){const c=classe(cel(p.nome,t,d,a));if(c.k!=='aula')continue;const sel=x.todo||x.aulas.includes(a);s+=`<button class="tog a" aria-pressed="${sel}" data-act="ausAula" data-p="${esc(p.nome)}" data-a="${a}">${a+1}ª · ${esc(c.turma)}</button>`}}

 h+=`<div class="card"><h2>Substituições sugeridas</h2><p class="muted small">Ordem usada: plantão → horário livre → horário condicional (só se o professor tiver poucos no dia) → último recurso. Entre iguais, vai quem substituiu menos hoje e nos últimos 30 dias. Você pode trocar qualquer nome.</p>`;
 if(sem)h+=`<p class="tag t-c">${sem} aula(s) sem substituto</p> `;if(conf)h+=`<p class="tag t-c">${conf} conflito(s): a mesma pessoa em duas turmas no mesmo horário</p>`;

let Hv={modo:'prof',item:'',turno:0};
function vHorario(){
 if(vazio())return semDados('Horário','Nenhum horário importado ainda.');
 if(!S.turnos[Hv.turno])Hv.turno=0;
 const edita=view==='chorario'&&isMaster(),escolhe=veTudo()||edita;if(!escolhe){Hv.modo='prof';Hv.item=ME.nome}
 const lst=Hv.modo==='prof'?S.professores.map(p=>p.nome):S.turmas.filter(x=>x.turno===Hv.turno).map(x=>x.nome);

/* ---------- leitura da folha (OMR) ---------- */
function cinza(id){const g=new Uint8Array(id.width*id.height),d=id.data;for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return{w:id.width,h:id.height,g}}
function otsu(g){const h=new Array(256).fill(0);for(let i=0;i<g.length;i++)h[g[i]]++;let tot=g.length,sum=0;for(let i=0;i<256;i++)sum+=i*h[i];let sB=0,wB=0,best=0,thr=127;for(let i=0;i<256;i++){wB+=h[i];if(!wB)continue;const wF=tot-wB;if(!wF)break;sB+=i*h[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;thr=i}}return thr}
function marcadores(im){const f=Math.max(1,Math.round(Math.max(im.w,im.h)/700)),w=Math.floor(im.w/f),h=Math.floor(im.h/f),s=new Uint8Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let a=0;for(let yy=0;yy<f;yy++)for(let xx=0;xx<f;xx++)a+=im.g[(y*f+yy)*im.w+x*f+xx];s[y*w+x]=a/(f*f)}
 const t=otsu(s),lab=new Int32Array(w*h),bl=[],st=[];let n=0;
 for(let i=0;i<w*h;i++){if(s[i]>t||lab[i])continue;n++;let area=0,x0=w,x1=0,y0=h,y1=0,sx=0,sy=0;st.push(i);lab[i]=n;
  while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;area++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&!lab[p-1]&&s[p-1]<=t){lab[p-1]=n;st.push(p-1)}if(x<w-1&&!lab[p+1]&&s[p+1]<=t){lab[p+1]=n;st.push(p+1)}if(y>0&&!lab[p-w]&&s[p-w]<=t){lab[p-w]=n;st.push(p-w)}if(y<h-1&&!lab[p+w]&&s[p+w]<=t){lab[p+w]=n;st.push(p+w)}}
  const bw=x1-x0+1,bh=y1-y0+1,fill=area/(bw*bh),asp=bw/bh;if(area>=12&&fill>0.6&&asp>0.6&&asp<1.65&&bw<w*0.2&&bh<h*0.2)bl.push({x:(sx/area+0.5)*f,y:(sy/area+0.5)*f,area})}
 if(bl.length<4)return null;const maxA=Math.max(...bl.map(b=>b.area)),big=bl.filter(b=>b.area>=maxA*0.45);if(big.length<4)return null;
 const cs=[[0,0],[im.w,0],[im.w,im.h],[0,im.h]];const pick=cs.map(([cx,cy])=>{let m=null,md=1e18;for(const b of big){const dd=(b.x-cx)**2+(b.y-cy)**2;if(dd<md){md=dd;m=b}}return m});if(new Set(pick).size<4)return null;return pick}
function resolver(A,b){const n=b.length,M=A.map((r,i)=>r.concat(b[i]));for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;if(Math.abs(M[p][c])<1e-12)return null;const tmp=M[c];M[c]=M[p];M[p]=tmp;for(let r=0;r<n;r++){if(r===c)continue;const k=M[r][c]/M[c][c];for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j]}}return M.map((r,i)=>r[n]/r[i])}
function homog(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[X,Y]=src[i],[x,y]=dst[i];A.push([X,Y,1,0,0,0,-x*X,-x*Y]);b.push(x);A.push([0,0,0,X,Y,1,-y*X,-y*Y]);b.push(y)}const h=resolver(A,b);if(!h)return null;return(X,Y)=>{const z=h[6]*X+h[7]*Y+1;return[(h[0]*X+h[1]*Y+h[2])/z,(h[3]*X+h[4]*Y+h[5])/z]}}
function media(im,cx,cy,r0,r1){let s=0,n=0;const R=Math.ceil(r1);for(let y=Math.floor(cy-R);y<=cy+R;y++)for(let x=Math.floor(cx-R);x<=cx+R;x++){if(x<0||y<0||x>=im.w||y>=im.h)continue;const d=Math.hypot(x-cx,y-cy);if(d>=r0&&d<=r1){s+=im.g[y*im.w+x];n++}}return n?s/n:255}
function analisar(im,av,qrPt){const m=marcadores(im);if(!m)return{erro:'Não encontrei os 4 quadrados pretos dos cantos. Tire a foto de novo, com a folha inteira aparecendo.'};
 let k=1;if(qrPt){let md=1e18;m.forEach((p,i)=>{const d=(p.x-qrPt.x)**2+(p.y-qrPt.y)**2;if(d<md){md=d;k=i}})}
 const dst=[0,1,2,3].map(i=>{const p=m[(k+i)%4];return[p.x,p.y]});const H=homog(MARC,dst);if(!H)return{erro:'Não consegui alinhar a folha. Tire a foto mais de cima.'};
 const G2=geom(av),val=Array.from({length:av.nq},()=>[]);
 for(const b of G2){const[cx,cy]=H(b.x,b.y),[ex,ey]=H(b.x+1,b.y),sc=Math.hypot(ex-cx,ey-cy);const dentro=media(im,cx,cy,0,b.r*0.62*sc),anel=media(im,cx,cy,b.r*1.45*sc,b.r*1.65*sc);val[b.q][b.j]=Math.max(0,(anel-dentro)/Math.max(anel,1))}

 let qr=null,qrPt=null;try{const jsQR=await carregar(LIB_JSQR,'jsQR');const code=jsQR(id.data,id.width,id.height);if(code&&/^P1\|/.test(code.data)){const[,a,e]=code.data.split('|');qr={av:a,est:e};const L=code.location;qrPt={x:(L.topLeftCorner.x+L.bottomRightCorner.x)/2,y:(L.topLeftCorner.y+L.bottomRightCorner.y)/2}}}catch(e){}

 q.e=en.join('\n').replace(/^\d+\s*[\)\.\-]\s*/,'');if(q.alts.length>=2){while(q.alts.length<4)q.alts.push('');out.push(q)}}return out}
function embaralhar(arr,seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;const a=arr.slice();for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);const t=a[i];a[i]=a[j];a[j]=t}return a}

function relHTML(r){const lim=a=>a.slice(0,25).map(x=>`<li>${esc(x)}</li>`).join('')+(a.length>25?`<li>… e mais ${a.length-25}</li>`:'');

function parse(txt){txt=String(txt||'').replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const del=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',');
 const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"'&&f==='')q=true;else if(c===del){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 row.push(f);rows.push(row);return rows.map(r=>r.map(x=>x.trim()))}
function linhas(txt){const rows=parse(txt);let off=1;if(rows.length&&/nome|professor|estudante/.test(norm(rows[0][0]))){rows.shift();off=2}return rows.map((r,i)=>({r,ln:i+off})).filter(o=>o.r.some(x=>x))}
function valProf(txt){const erros=[],alertas=[],out=[],vis=new Set();for(const{r,ln}of linhas(txt)){const nome=r[0]?.replace(/\s+/g,' ');if(!nome){erros.push(`Linha ${ln}: falta o nome.`);continue}if(vis.has(norm(nome))){erros.push(`Linha ${ln}: “${nome}” aparece duas vezes.`);continue}vis.add(norm(nome));out.push({nome,componente:r[1]||'',telefone:r[2]||''})}
 if(!out.length&&!erros.length)erros.push('Não encontrei nenhuma linha preenchida.');
 const sai=[...new Set(S.horario.map(h=>h.prof))].filter(p=>!vis.has(norm(p)));if(sai.length)alertas.push('Estes professores não estão na nova lista e o horário deles será apagado: '+sai.join(', '));
 return{erros,alertas,resumo:out.length+' professor(es)',aplicar(){for(const p of out){const ant=S.professores.find(x=>norm(x.nome)===norm(p.nome));if(ant)p.id=ant.id}const ren=new Map();for(const p of out){const ant=S.horario.find(h=>norm(h.prof)===norm(p.nome));if(ant)ren.set(ant.prof,p.nome)}S.horario=S.horario.filter(h=>ren.has(h.prof)).map(h=>Object.assign(h,{prof:ren.get(h.prof)}));S.professores=out}}}
function valEst(txt){const erros=[],alertas=[],out=[],tur=new Map();for(const t of S.turmas)tur.set(kT(t.nome),{nome:t.nome,turno:t.turno,id:t.id});
 for(const{r,ln}of linhas(txt)){const nome=(r[0]||'').replace(/\s+/g,' '),tn=r[1]||'';if(!nome||!tn){erros.push(`Linha ${ln}: falta ${!nome?'o nome':'a turma'}.`);continue}const t=turnoIdx(r[2]);if(t<0){erros.push(`Linha ${ln}: turno “${r[2]||''}” não existe (turnos: ${S.turnos.map(x=>x.nome).join(', ')}).`);continue}
  if(tipoPorSigla(tn)){erros.push(`Linha ${ln}: a turma “${tn}” tem o mesmo nome de uma sigla. Mude o nome da turma ou da sigla.`);continue}

 if(!out.length&&!erros.length)erros.push('Não encontrei nenhuma linha preenchida.');
 const novas=[...tur.values()].filter(x=>x.nova);if(novas.length)alertas.push('Turmas novas: '+novas.map(x=>x.nome).join(', '));
 return{erros,alertas,resumo:out.length+' estudante(s) em '+new Set(out.map(o=>o.turma)).size+' turma(s)',aplicar(){for(const e of out){const ant=S.estudantes.find(x=>norm(x.nome)===norm(e.nome)&&x.turma===e.turma);if(ant)e.id=ant.id}S.turmas=[...tur.values()].map(x=>({id:x.id,nome:x.nome,turno:x.turno}));S.estudantes=out}}}
function valHor(txt){const erros=[],alertas=[],out=[],vis=new Set(),novas=new Map(),slot=new Map();
 if(!S.professores.length)return{erros:['Importe primeiro os professores (bloco 1).'],alertas,resumo:''};
 const sig=S.tipos.map(x=>x.sigla).join(', ');
 const turmaK=c=>{const tu=turmaPor(c);if(tu)return{nome:tu.nome,turno:tu.turno};return novas.get(kT(c))};
 for(const{r,ln}of linhas(txt)){const[pn,tn,dn,...cs]=r;const p=S.professores.find(x=>norm(x.nome)===norm(pn));if(!p){erros.push(`Linha ${ln}: o professor “${pn||''}” não está cadastrado. Confira se o nome está igual ao da lista de professores.`);continue}
  const t=turnoIdx(tn);if(t<0){erros.push(`Linha ${ln}: turno “${tn||''}” não existe.`);continue}const d=diaIdx(dn);if(d<0){erros.push(`Linha ${ln}: dia “${dn||''}” não reconhecido (use Segunda, Terça…).`);continue}
  const key=p.nome+'|'+t+'|'+d;if(vis.has(key)){erros.push(`Linha ${ln}: ${p.nome} aparece duas vezes em ${S.turnos[t].nome}, ${dias()[d]}.`);continue}vis.add(key);
  const n=nAulas(t),aulas=Array(n).fill('');
  cs.forEach((c,ci)=>{c=String(c||'').trim();if(!c)return;if(ci>=n){erros.push(`Linha ${ln}: há algo na ${ci+1}ª aula, mas o turno ${S.turnos[t].nome} tem ${n} aulas.`);return}
   let cl=classe(c);if(cl.k==='erro'){if(/\d/.test(c)){const ex=novas.get(kT(c));if(!ex)novas.set(kT(c),{nome:c,turno:t});else if(ex.turno!==t){erros.push(`Linha ${ln}: a turma ${c} aparece em dois turnos.`);return}}else{erros.push(`Linha ${ln}, ${ci+1}ª aula: “${c}” não é turma nem sigla. Siglas válidas: ${sig}.`);return}}
   const tk=turmaK(c);if(tk){if(tk.turno!==t){erros.push(`Linha ${ln}: a turma ${tk.nome} é do turno ${S.turnos[tk.turno]?.nome}, não de ${S.turnos[t].nome}.`);return}const sk=t+'|'+d+'|'+ci+'|'+kT(tk.nome);slot.set(sk,(slot.get(sk)||[]).concat(p.nome))}
   aulas[ci]=c});
  const ant=linha(p.nome,t,d);out.push({id:ant?.id,prof:p.nome,turno:t,dia:d,aulas})}
 if(!out.length&&!erros.length)erros.push('Não encontrei nenhuma linha preenchida.');
 for(const[k,ps]of slot)if(ps.length>1){const[t,d,a,tk]=k.split('|');alertas.push(`${dias()[+d]}, ${+a+1}ª aula: ${ps.join(' e ')} na mesma turma (${(turmaK(tk)||{}).nome||tk}). Se não for aula compartilhada, corrija.`)}
 const todas=S.turmas.map(x=>({nome:x.nome,turno:x.turno})).concat([...novas.values()]);
 for(const tu of todas){let falta=0,tem=0;for(let d=0;d<dias().length;d++)for(let a=0;a<nAulas(tu.turno);a++){if(slot.has(tu.turno+'|'+d+'|'+a+'|'+kT(tu.nome)))tem++;else falta++}
  if(!tem)alertas.push(`A turma ${tu.nome} não aparece no horário.`);else if(falta)alertas.push(`Turma ${tu.nome}: ${falta} horário(s) sem professor no quadro.`)}
 if(novas.size)alertas.push('Turmas que não estavam cadastradas e serão criadas: '+[...novas.values()].map(x=>x.nome).join(', '));

function lerTexto(f,cod){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=()=>ok('');r.readAsText(f,cod)})}
async function lerArquivo(f){if(/\.xlsx?$/i.test(f.name)){const X=await carregar(LIB_XLSX,'XLSX');const wb=X.read(await f.arrayBuffer(),{type:'array'});return X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:'\t',blankrows:false})}

function lerRegras(){const n=JSON.parse(JSON.stringify(S));const v=id=>($(id)?.value??'');
 n.escola=v('rEscola').trim();
 document.querySelectorAll('[data-tf]').forEach(el=>{const t=n.turnos[+el.dataset.i];if(t)t[el.dataset.tf]=el.dataset.tf==='aulas'?Math.max(1,Math.min(12,parseInt(el.value)||1)):el.value.trim()});
 document.querySelectorAll('[data-pf]').forEach(el=>{const t=n.tipos[+el.dataset.i];if(t)t[el.dataset.pf]=el.dataset.pf==='limite'?Math.max(0,parseInt(el.value)||0):el.value.trim()});
 n.sabado=!!$('rSab')?.checked;const ls=s=>String(s).split('\n').map(x=>x.trim()).filter(Boolean);
 n.reserva=ls(v('rRes'));if($('rPeriodos'))n.periodos=ls(v('rPeriodos'));
 document.querySelectorAll('[data-lst]').forEach(el=>{n.listas[el.dataset.lst]=ls(el.value)});
 if($('rItens')){const it={};for(const l of ls(v('rItens'))){const i=l.indexOf(':');if(i<1)continue;const c=l.slice(0,i).trim(),a=l.slice(i+1).trim();if(a)(it[c]||(it[c]=[])).push(a)}n.listas.itens=it}
 if($('rOcIni'))n.ocInicial=Math.max(0,parseFloat(v('rOcIni'))||0);if($('rOcData'))n.ocInicio=v('rOcData');
 if($('rOcTipos'))n.ocTipos=ls(v('rOcTipos')).map(l=>{const p=l.split(';');return{nome:p[0].trim(),desconto:Math.max(0,parseFloat((p[1]||'0').replace(',','.'))||0)}}).filter(t=>t.nome);
 if($('rOcProv'))n.ocProvidencias=ls(v('rOcProv'));return n}
function validaRegras(n){const e=[];if(n.turnos.some(t=>!t.nome))e.push('Todo turno precisa de nome.');const sg=n.tipos.map(t=>kT(t.sigla));if(sg.some(s=>!s))e.push('Toda sigla precisa ser preenchida.');if(new Set(sg).size!==sg.length)e.push('Há siglas repetidas.');

 pvApagar:b=>{if(!confirma(b,'pv'))return;S.tentativas=S.tentativas.filter(t=>t.prova!==P.id);S.provas=S.provas.filter(p=>p.id!==P.id);save();A.pvVoltar()},

 /* login */

 auEsqueci:async()=>{const email=$('auEmail').value.trim();if(!email)return toast('Escreva o seu e-mail acima.');await clienteSB();await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});toast('Se o e-mail estiver cadastrado, você vai receber um link.')},
 esEntrar:async()=>{const cod=$('esCod').value.trim().toUpperCase(),nome=$('esNome').value.trim();if(!cod||!nome){AU.erro='Preencha o código e o seu nome.';return render()}const{data,error}=await sb.rpc('prumo_entrar_escola',{p_codigo:cod,p_nome:nome});if(error||!data){AU.erro='Código não encontrado.';return render()}iniciarServidor()},
 esCriar:async()=>{const esc2=$('esEscola').value.trim(),nome=$('esNome2').value.trim();if(!esc2||!nome){AU.erro='Preencha o nome da escola e o seu nome.';return render()}const{error}=await sb.rpc('prumo_criar_escola',{p_nome:esc2,p_meu_nome:nome});if(error){AU.erro='Não consegui cadastrar: '+error.message;return render()}S.escola=esc2;await iniciarServidor();save()},
 sair:async()=>{if(sb)await sb.auth.signOut();location.hash='';location.reload()},
 mRemover:async b=>{const m=MEMBROS[+b.dataset.i];if(!m||!confirma(b,'m'+m.user_id))return;const{error}=await sb.from('membros').delete().eq('escola_id',ESCOLA).eq('user_id',m.user_id);if(error)return toast('Não consegui remover.');await carregarMembros();render()}};

const C={
 gData:el=>{G.data=el.value;G.aus={};G.esc={};render()},

 cel:el=>{const t=Hv.turno,d=+el.dataset.d,a=+el.dataset.a,v=el.value.trim();let l=linha(Hv.item,t,d);if(!l){l={id:uid(),prof:Hv.item,turno:t,dia:d,aulas:Array(nAulas(t)).fill('')};S.horario.push(l)}while(l.aulas.length<nAulas(t))l.aulas.push('');l.aulas[a]=v;const c=classe(v);save();render();if(c.k==='erro')toast(`“${v}” não é turma nem sigla.`)},

 fotoEst:el=>{K.fotos[+el.dataset.i].est=el.value;render()},
 rTurma:el=>{R.turma=el.value;R.est='';render()},rEst:el=>{R.est=el.value;render()},rPer:el=>{R.periodo=el.value;render()},rProf:el=>{R.prof=el.value;render()},
 rComp:()=>{const e=estPorId(R.est);if(!e)return;let c=contribs(e.id,R.periodo).find(x=>x.prof===R.prof);const comp=$('rComp').value.trim();if(c){if(!podeEditar(c))return;c.componente=comp}else{c={id:uid(),est:e.id,periodo:R.periodo,prof:R.prof,autorUid:ME.uid,componente:comp,marcados:{},itens:{},aee:'',consideracao:''};S.relatorios.push(c)}save();render()},
 oTurma:el=>{O.turma=el.value;O.sel=[];render()},
 oFT:el=>{O.filtroT=el.value;O.filtroE='';render()},oFE:el=>{O.filtroE=el.value;render()},oPT:el=>{O.pontosT=el.value;render()},
 mNome:async el=>{const m=MEMBROS[+el.dataset.i];const{error}=await sb.from('membros').update({nome:el.value}).eq('escola_id',ESCOLA).eq('user_id',m.user_id);if(error)toast('Não consegui salvar.');else{m.nome=el.value;toast('Salvo.')}},
 mPapel:async el=>{const m=MEMBROS[+el.dataset.i];const{error}=await sb.from('membros').update({papel:el.value}).eq('escola_id',ESCOLA).eq('user_id',m.user_id);if(error)toast('Não consegui salvar.');else{m.papel=el.value;toast('Papel alterado.')}}};

{const v=location.hash.slice(1);if(v==='aluno')retomarProva();
